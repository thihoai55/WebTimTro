<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header-include"></div>
    <h1>Trang Chủ</h1>
    <script>
        fetch('Header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-include').innerHTML = data;
            });
    </script>
</body>
</html>
